server:
  port: 13355
  servlet:
    context-path: /api
  tomcat:
    max-http-form-post-size: 20MB
    max-swallow-size: 20MB

spring:
  application:
    name: thesis-format
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/thesis_format?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD} # 必填: MySQL 密码
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: false
  mail:
    host: smtp.qq.com
    port: 465
    username: 2651896126@qq.com
    password: ${MAIL_PASSWORD} # 必填: 邮箱SMTP授权码
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          ssl:
            enable: true
          auth: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

thesis:
  jwt:
    secret: ${JWT_SECRET} # 必填: JWT签名密钥(至少32字符)
    expire-hours: 72
  storage:
    dir: ${STORAGE_DIR:./data/storage}
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176
  scheduler:
    interval: 1500 # 排版任务调度扫描间隔(毫秒)
  backup:
    max-keep: 7 # 数据库备份最多保留份数
  oauth:
    github:
      client-id: ${GITHUB_CLIENT_ID:} # GitHub OAuth: 可选, 填入后启用 GitHub 登录
      client-secret: ${GITHUB_CLIENT_SECRET:}
      redirect-uri: http://localhost:13355/api/auth/github/callback
      frontend-url: http://localhost:5173

logging:
  level:
    com.graduate.thesis: info
