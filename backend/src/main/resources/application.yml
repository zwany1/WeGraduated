server:
  port: 13355
  servlet:
    context-path: /api
  tomcat:
    max-http-form-post-size: 20MB
    max-swallow-size: 20MB

spring:
  profiles:
    active: dev
  application:
    name: thesis-format
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/thesis_format?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      # 生产不因单条幂等SQL失败阻断启动(schema 全 IF NOT EXISTS, 正常不失败; 真异常由运行时明确报错)
      continue-on-error: true
  mail:
    host: smtp.qq.com
    port: 465
    username: 2651896126@qq.com
    password: ${MAIL_PASSWORD}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          ssl:
            enable: true
          auth: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

thesis:
  admin:
    password: ${THESIS_ADMIN_PASSWORD}
  jwt:
    secret: ${JWT_SECRET}
    expire-hours: 72
  storage:
    dir: ${STORAGE_DIR:./data/storage}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176}
  scheduler:
    interval: ${SCHEDULER_INTERVAL:1500}
  backup:
    max-keep: ${BACKUP_MAX_KEEP:7}

logging:
  level:
    com.graduate.thesis: ${THESIS_LOG_LEVEL:info}
